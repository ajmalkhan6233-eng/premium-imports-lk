<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Premium Imports LK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1 id="loginShopName">Premium Imports LK</h1>
    <p>Sign in to continue</p>
    <div class="user-picker" id="userPicker"></div>
    <input type="password" id="pinInput" maxlength="8" placeholder="PIN" inputmode="numeric">
    <div class="error-text" id="loginError"></div>
    <button class="btn block" id="loginBtn">Sign In</button>
  </div>
</div>

<div id="appShell" class="hidden">
  <aside class="sidebar">
    <div class="brand" id="sidebarBrand">Premium Imports LK</div>
    <nav id="sidebarNav"></nav>
    <div class="footer-user">
      Signed in as <strong id="sidebarUser"></strong><br>
      <a href="#" id="logoutLinkSidebar">Sign out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Home</h1>
      <div id="liveClock" class="live-clock"></div>
    </div>
    <div id="onlineOrdersBadge" class="hidden"></div>
    <div id="pageContent"></div>
  </div>

  <nav class="bottomnav" id="bottomNav"></nav>
  <div id="sellTotalBarRoot"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="/lib/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
