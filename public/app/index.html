<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Premium Imports LK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen">
  <div id="loginAmbientBg" class="ambient-bg"></div>
  <div class="login-card">
    <h1 id="loginShopName">Premium Imports LK</h1>
    <p>Sign in to continue</p>
    <div class="user-picker" id="userPicker" role="group" aria-label="Choose your account"></div>
    <label for="pinInput" class="sr-only">PIN</label>
    <input type="password" id="pinInput" maxlength="8" placeholder="PIN" inputmode="numeric">
    <div class="error-text" id="loginError"></div>
    <button class="btn block" id="loginBtn">Sign In</button>
  </div>
</div>

<div id="appShell" class="hidden">
  <header class="topnav">
    <div class="topnav-brand" id="sidebarBrand">Premium Imports LK</div>
    <nav id="sidebarNav" class="topnav-tabs"></nav>
    <div class="topnav-user">
      <span>Signed in as <strong id="sidebarUser"></strong></span>
      <a href="#" id="logoutLinkSidebar">Sign out</a>
    </div>
  </header>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Home</h1>
      <div style="display:flex;align-items:center">
        <div id="livePulse" class="live-pulse"></div>
        <div id="liveClock" class="live-clock"></div>
      </div>
    </div>
    <div id="onlineOrdersBadge" class="hidden"></div>
    <div id="pageContent"></div>
  </div>

  <nav class="bottomnav" id="bottomNav"></nav>
  <div id="sellTotalBarRoot"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="vendorPrintArea" style="position:absolute;left:-9999px;top:0"></div>

<script src="/lib/qrcode.js"></script>
<script src="/lib/ambient-bg.js"></script>
<script src="dashboard.js"></script>
<script src="products.js"></script>
<script src="grn.js"></script>
<script src="sell.js"></script>
<script src="bills.js"></script>
<script src="customers.js"></script>
<script src="vendors.js"></script>
<script src="loans.js"></script>
<script src="expenses.js"></script>
<script src="messages.js"></script>
<script src="reports.js"></script>
<script src="help.js"></script>
<script src="settings.js"></script>
<script src="siteEditor.js"></script>
<script src="app.js"></script>
</body>
</html>
